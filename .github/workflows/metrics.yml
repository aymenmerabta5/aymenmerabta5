name: Refresh profile metrics

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/metrics.yml

permissions:
  contents: write

concurrency:
  group: profile-metrics
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Generate public GitHub metrics
        uses: lowlighter/metrics@366f8b9dfe3a59656c67d5dcad9950f59c9bc96d
        with:
          token: ${{ github.token }}
          user: aymenmerabta5
          template: classic
          filename: assets/github-metrics.svg
          base: header, activity, community, repositories
          base_indepth: yes
          config_timezone: Africa/Algiers

  code-activity:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the refreshed profile
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main

      - name: Generate public code statistics
        run: node .github/scripts/generate-code-stats.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROFILE_USERNAME: aymenmerabta5

      - name: Publish updated statistics
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/code-stats.svg
          if git diff --cached --quiet; then
            echo "Statistics are already current."
            exit 0
          fi
          git commit -m "Update public code statistics [skip ci]"
          git push
